<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jashan Multani — Computer Engineering</title>
<meta name="description" content="Computer Engineering at Waterloo. Firmware, embedded systems, and the point where software starts moving something physical. Pick your console.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- ============================ BOOT ============================ -->
<div id="boot">
  <div class="boot-lcd">
    <div class="boot-logo">JASHAN MULTANI</div>
    <div class="boot-sub">PRESS ANY KEY</div>
  </div>
  <button class="boot-skip" type="button">Skip</button>
</div>

<!-- ======================== MODE SWITCHER ======================= -->
<div id="modeSwitch" class="hide" aria-label="Choose interface"></div>

<!-- ========================= MODE PICKER ======================== -->
<main id="picker" class="hide">
  <div class="picker-in">
    <h1>Pick your console</h1>
    <p class="lede">Same portfolio, four interfaces. I built a Game Boy because a list of projects is
      boring &mdash; but there's a normal website in here too if you're in a hurry.</p>

    <div class="picker-grid">
      <button class="pick" type="button" data-mode="gb">
        <span class="pick-art art-gb"><i></i></span>
        <span class="pick-meta"><strong>Game Boy</strong>
          <span>Green LCD, D-pad navigation, one menu at a time. The full experience.</span></span>
      </button>

      <button class="pick" type="button" data-mode="ps">
        <span class="pick-art art-ps"><i></i></span>
        <span class="pick-meta"><strong>PlayStation</strong>
          <span>Big cover art, a project rail, and a hero panel. Arrow keys move the rail.</span></span>
      </button>

      <button class="pick" type="button" data-mode="sw">
        <span class="pick-art art-sw"><i></i></span>
        <span class="pick-meta"><strong>Switch</strong>
          <span>Square tiles and a dock along the bottom. Quick to skim.</span></span>
      </button>

      <button class="pick" type="button" data-mode="plain">
        <span class="pick-art art-plain"><i></i></span>
        <span class="pick-meta"><strong>Boring mode</strong>
          <span>An ordinary scrolling website. No games, no boot screen. Recruiters, start here.</span></span>
      </button>
    </div>

    <p class="lede" style="margin:34px auto 0;font-size:14px">
      Switch consoles any time from the corner &mdash;
      <a href="#" id="pickAgain">or come back to this screen</a>.
    </p>
  </div>
</main>

<!-- ============================ STAGE =========================== -->
<div id="stage" class="hide"></div>

<script src="assets/js/content.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
